name: energy-monitor

services:
  emqx:
    image: emqx/emqx:5.8.6
    ports:
      - "1883:1883"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
      POSTGRES_DB: energy
    ports:
      - "5433:5432"
    volumes:
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "energy", "-d", "energy"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://energy:energy@timescaledb:5432/energy
      MQTT_URL: mqtt://emqx:1883
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "3000:3000"
    depends_on:
      emqx:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  simulator:
    build: ./simulator
    environment:
      MQTT_URL: mqtt://emqx:1883
      HOMES: "2"
      INTERVAL_MS: "2000"
    depends_on:
      emqx:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescale-data:
